<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerelmünk térképe</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { 
            height: 450px; 
            width: 100%; 
            border: 4px double #8e0e0e; 
            border-radius: 4px;
            margin-bottom: 20px;
            z-index: 1; /* Hogy a popupok jó helyen legyenek */
        }
        .memory-marker {
            background: transparent;
            border: 0;
        }
        .memory-marker__pin {
            position: absolute;
            top: 1px;
            left: 4px;
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            transform: rotate(-45deg);
            border: 2px solid #fdfbf7;
            border-radius: 50% 50% 50% 0;
            background: #8e0e0e;
            box-shadow: 0 2px 5px rgba(40, 15, 15, 0.45);
            color: #f5d995;
            transition: transform 160ms ease, background-color 160ms ease;
        }
        .memory-marker:hover .memory-marker__pin {
            transform: rotate(-45deg) translateY(-2px);
            background: #630808;
        }
        .memory-marker__pin > span {
            transform: rotate(45deg);
            font-size: 17px;
            line-height: 1;
        }
        /* Popup stílusa, hogy illeszkedjen a kuckós dizájnhoz */
        .leaflet-popup-content-wrapper {
            background: #fdfbf7;
            border: 2px solid #8e0e0e;
            font-family: 'Georgia', serif;
        }
        .leaflet-popup-content img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            margin-top: 10px;
            border: 1px solid #ccc;
        }
        .popup-link {
            display: inline-block;
            margin-top: 10px;
            color: #8e0e0e;
            text-decoration: none;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body class="result-body">

    <div class="content-card" style="max-width: 800px; width: 95%;">
        <h2>Szerelmünk térképe</h2>
        <p style="margin-bottom: 20px;">Kattints a jelölőkre a térképen!</p>
        
        <div id="map"></div>

        <a href="index.html" class="back-btn">Vissza a főoldalra</a>
    </div>

    <script src="script.js"></script> 
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="map-script.js"></script>
</body>
</html>
